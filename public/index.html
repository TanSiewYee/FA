<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        body {font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0;}
        .container {width: 90%; max-width: 420px; margin: 80px auto; background-color: white; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);}
        h2 {text-align: center; color: #333;}
        p {text-align: center; color: #666;}
        label {display: block; margin-top: 15px; font-weight: bold;}
        input {width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;}
        button {width: 100%; padding: 12px; margin-top: 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;}
        button:hover {background-color: #0056b3;}
        .link {text-align: center; margin-top: 20px;}
        .link a {color: #007bff; text-decoration: none;}
    </style>
</head>

<body>
    <div class="container">
        <h2>Healthcare System Login</h2>
        <p>Please login to continue.</p>
        <form action="/login" method="POST">
            <label>Username or Email</label>
            <input
                type="text"
                name="login"
                required
            >
            <label>Password</label>
            <input
                type="password"
                name="password"
                required
            >
            <button type="submit">
                Login
            </button>
        </form>
        <div class="link">
            Don't have an account?
            <a href="/register.html">
                Register
            </a>
        </div>
    </div>
</body>
</html>
