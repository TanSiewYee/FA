<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        body {font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0;}
        .container {width: 90%; max-width: 450px; margin: 60px auto; background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);}
        h2 {text-align: center; color: #333;}
        p {text-align: center; color: #666; line-height: 1.5;}
        label {display: block; margin-top: 15px; font-weight: bold;}
        input {width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;}
        button {width: 100%; padding: 12px; margin-top: 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;}
        button:hover {background-color: #0056b3;}
        .link {text-align: center; margin-top: 20px;}
        .link a {color: #007bff; text-decoration: none;}
    </style>
</head>

<body>

    <div class="container">
        <h2>Create Account</h2>
        <p>
            Your account type will be automatically
            identified using your registered email address.
        </p>

        <form action="/register" method="POST">

            <label>Username</label>
            <input
                type="text"
                name="username"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                required
            >
            <label>Password</label>
            <input
                type="password"
                name="password"
                minlength="6"
                required
            >
            <label>Confirm Password</label>
            <input
                type="password"
                name="confirm_password"
                minlength="6"
                required
            >
            <button type="submit">
                Register
            </button>
        </form>
        <div class="link">
            Already have an account?
            <a href="/login.html">
                Login
            </a>
        </div>
    </div>
</body>
</html>
